# Builds winwrap.lib and winwrap.dll with MSVC 2022 using the Makefile,
# for both architectures, release and debug, then checks and runs the unit
# tests.
#
# Manual only. There is no push or pull_request trigger on purpose: this builds
# eight flavours and runs eight test binaries, and nothing here changes often
# enough to want that on every commit.
#
# What it proves, in order, because each step is only meaningful if the one
# before it passed:
#
#   1. The generated forwarders still match src/static_redirects.cc. They are
#      generated and checked in, so nothing else would notice them drifting.
#   2. Everything builds with plain MSVC -- no clang-cl, no extra Visual Studio
#      component. That is the whole point of the Makefile existing alongside
#      BUILD.gn.
#   3. Each test binary actually imports winwrap rather than the system. This
#      is the check that cannot be skipped: linking winwrap and *using* it are
#      different things, and when it goes wrong nothing says so -- the binary
#      links, passes its tests on the runner, and fails at load on the old
#      Windows it was built for.
#
#      It checks only the names winwrap covers, which it reads from
#      static_redirects.cc, so it says nothing about an import winwrap has no
#      shim for. That limit barely bites here, where the test binaries call
#      little beyond the covered set, but it is the same tool a consumer runs
#      over a whole application -- see the note in sawbuck-ng's workflow.
#   4. The tests pass. Two architectures by two flavours, since the static
#      form and the shared form reach winwrap by different mechanisms and only
#      running both tests either -- and each of those as a release and as a
#      debug build, which link different CRTs (/MT and /MTd) and so make
#      different calls of their own through winwrap.

name: Build Winwrap

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Windows SDK to build against, passed to vcvarsall below. Kept here so
  # there is one line to change, and matching what sawbuck-ng pins through
  # msvs_windows_target_platform_version -- the two trees share winwrap, so
  # they should not disagree about which SDK it was validated against.
  WINDOWS_SDK: 10.0.26100.0

jobs:
  build:
    name: Build with MSVC
    # Pinned rather than windows-latest, which has moved to 2025 and will move
    # again. Visual Studio 2022 is what this is for.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout winwrap
        uses: actions/checkout@v4

      - name: Record Git Revision
        id: rev
        shell: cmd
        run: |
          rem Redirection first, deliberately. `echo short=%%i>> file` breaks when
          rem the hash ends in a digit: cmd reads the trailing digit as a stream
          rem number, so `...a1>> file` redirects stream 1 and writes "short=a".
          for /f %%i in ('git rev-parse --short HEAD') do >>%GITHUB_OUTPUT% echo short=%%i

      # Guards a generated, checked-in file. Cheap, and the only thing that
      # would catch a WINWRAP_REDIRECT added to static_redirects.cc without
      # regenerating the .asm -- which fails as a missing __imp_ slot much
      # later, in somebody else's link.
      - name: Check generated forwarders are current
        run: python tools/gen_forwarders.py --check

      # Which SDK the build will use, before it uses it. vcvarsall below is
      # given WINDOWS_SDK by name, so there is nothing to predict here -- the
      # only question is whether that version is present. vcvarsall would fail
      # on its own if it were not, but it reports the version it was asked for
      # and not the ones it could have had, so this prints the list while there
      # is still something useful to do with it.
      #
      # Filtered to 10.*, because Include\ also holds a 'wdf' directory. That
      # matters more in sawbuck-ng's workflow, where a first attempt at this
      # sorted the names to guess which one GYP would take and 'wdf' sorted
      # above every digit; here it is only noise in a listing.
      #
      # A failure here means the runner image changed its SDKs, which is
      # outside this repository's control: read the list and update
      # WINDOWS_SDK.
      - name: Check Windows SDK Version
        shell: cmd
        run: |
          set "KITS=%ProgramFiles(x86)%\Windows Kits\10\Include"
          echo Installed SDKs:
          dir /b /o-n "%KITS%\10.*" || exit /b 1
          echo.
          echo Building against %WINDOWS_SDK%
          if exist "%KITS%\%WINDOWS_SDK%\um\windows.h" exit /b 0
          echo ERROR: Windows SDK %WINDOWS_SDK% is not installed on this runner.
          echo        Update WINDOWS_SDK in this workflow to one of the above.
          exit /b 1

      # The clang-cl path, which nothing else here covers, and one file that
      # nothing covers at all.
      #
      # BUILD.gn compiles src/static_redirects.cc -- the redirect table written
      # with Clang asm labels -- and neither the Makefile nor winwrap.gyp ever
      # does, because both assemble the generated .asm instead. So the single
      # file tools/gen_forwarders.py reads from was the one file no CI build
      # compiled. The GN form of the unit test went unchecked too, and that is
      # exactly where it bit: a block-scope `extern "C"`, which MSVC accepts as
      # an extension and clang rejects outright per [dcl.link]/4, built clean
      # through nmake and GYP and would have failed only in Chromium.
      #
      # Syntax-only, so it costs seconds and links nothing. Not a substitute
      # for a GN build -- it is the cheapest check that stops the three build
      # systems disagreeing about whether the sources are even valid C++.
      #
      # The defines mirror BUILD.gn's two targets rather than being invented
      # here: winwrap's own sources at its lowered target, winwrap_dll.cc with
      # WINWRAP_DLL because it is in the shared target only, and the test
      # against the current SDK with exceptions on.
      - name: Syntax Check
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x86 %WINDOWS_SDK% || exit /b 1
          set "CLANGCL=%VSPATH%\VC\Tools\Llvm\bin\clang-cl.exe"
          if not exist "%CLANGCL%" set "CLANGCL=%ProgramFiles%\LLVM\bin\clang-cl.exe"
          if not exist "%CLANGCL%" (
            echo ERROR: no clang-cl found. Looked in Visual Studio's Llvm
            echo        directory and in %%ProgramFiles%%\LLVM. The runner image
            echo        ships LLVM; if that has changed, either install it in
            echo        this step or drop the step and say so here, because
            echo        nothing else compiles static_redirects.cc.
            exit /b 1
          )
          "%CLANGCL%" --version || exit /b 1
          set "LOW=-U_WIN32_WINNT -D_WIN32_WINNT=0x0501 -UNTDDI_VERSION -DNTDDI_VERSION=0x05010300 -UWINVER -DWINVER=0x0501"
          rem The defines every build of winwrap passes to both the library and
          rem the test, so this pass reads the sources as those builds do.
          set "DEFS=-DUSING_WINWRAP -DUNICODE -D_UNICODE"
          rem Both target widths, because static_redirects.cc picks its symbol
          rem decoration with #if defined(_M_IX86) and one pass would leave the
          rem other branch unparsed -- the x86 one being the awkward half, where
          rem the asm labels carry a leading underscore and the stdcall argument
          rem size. clang-cl's target is its own default, not the prompt's, so
          rem -m32/-m64 is what selects it.
          for %%b in (32 64) do (
            echo ---- -m%%b
            for %%f in (src\*.cc src\asm\*.cc) do "%CLANGCL%" /nologo /Zs -m%%b /std:c++17 /I src %LOW% %DEFS% -DWINWRAP_STATIC "%%f" || exit /b 1
            "%CLANGCL%" /nologo /Zs -m%%b /std:c++17 /I src %LOW% %DEFS% -DWINWRAP_DLL src\dll\winwrap_dll.cc || exit /b 1
            rem Three include directories for the test and one for the sources,
            rem matching the Makefile and both .gn/.gyp forms. winwrap's own
            rem sources reach the public header as "public/winwrap_public.h",
            rem relative to src; the test writes <winwrap_public.h> the way a
            rem consumer does, which needs src\public on the path by itself.
            "%CLANGCL%" /nologo /Zs -m%%b /std:c++17 /EHsc %DEFS% -DWINWRAP_STATIC -DWINWRAP_TEST /I src /I src\public /I test test\winwrap_unittest.cc || exit /b 1
          )

      # vcvarsall rather than a third-party action, and called inside the same
      # shell as nmake: each `run:` is a fresh process, so the environment it
      # sets would not survive to a later step. The Makefile takes the
      # architecture from VSCMD_ARG_TGT_ARCH, which vcvarsall sets, so the
      # prompt is the only switch there is.
      #
      # The SDK version is vcvarsall's second argument, and it is pinned rather
      # than left to "whatever is newest on the machine". There is no other
      # place to pin it for this build: nmake sees the SDK only through INCLUDE
      # and LIB, which vcvarsall is what sets. Pinning matters here more than
      # in most projects -- winwrap stands in front of the SDK's own
      # declarations, so a different SDK is a different set of functions to
      # stand in front of, and the mc.exe regression that made base emit
      # EventWriteTransfer where it used to emit EventWrite is exactly the kind
      # of thing that arrives with an SDK bump and nothing else.
      #
      # vcvarsall fails loudly if the version is not installed, which is the
      # behaviour wanted: a runner image that drops this SDK should stop the
      # build rather than quietly build against another one.
      #
      # `nmake all` builds both flavours and both test binaries for one
      # architecture, so two invocations cover all four.
      #
      # Then the same again with DEBUG=1: unoptimised, /MTd, and written to
      # out\<arch>\debug\<form> so that it sits beside the release build
      # instead of on top of it. A consumer building its own program /MTd needs
      # a winwrap built the same way, since a library and a program that
      # disagree about the CRT do not link.
      - name: Build x86
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x86 %WINDOWS_SDK% || exit /b 1
          rem What vcvarsall actually resolved, which is what nmake will see
          rem through INCLUDE and LIB -- the step above says the SDK is
          rem installed, this says it is the one in use.
          rem
          rem Asserted rather than printed. vcvarsall errors out if the version
          rem it is handed does not exist, so this should be unreachable; the
          rem point is that nothing downstream can tell the difference if it
          rem ever is not, because an SDK that resolved differently produces a
          rem clean build against the wrong headers. Matched as a substring,
          rem since WindowsSDKVersion carries a trailing backslash.
          echo SDK in use: %WindowsSDKVersion%  (%WindowsSdkDir%)
          echo %WindowsSDKVersion% | findstr /c:"%WINDOWS_SDK%" >nul || (echo ERROR: resolved SDK is not %WINDOWS_SDK% & exit /b 1)
          nmake all || exit /b 1
          nmake DEBUG=1 all || exit /b 1

      - name: Build x64
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 %WINDOWS_SDK% || exit /b 1
          echo SDK in use: %WindowsSDKVersion%  (%WindowsSdkDir%)
          echo %WindowsSDKVersion% | findstr /c:"%WINDOWS_SDK%" >nul || (echo ERROR: resolved SDK is not %WINDOWS_SDK% & exit /b 1)
          nmake all || exit /b 1
          nmake DEBUG=1 all || exit /b 1

      - name: Show what was built
        shell: cmd
        run: dir /s /b out\*.lib out\*.dll out\*.exe

      # The subsystem floor differs by architecture: 5.01 is Windows XP on x86,
      # and 64-bit Windows begins at 5.02, which is as low as the linker goes
      # for that machine. check_imports.py reads the covered-function list out
      # of static_redirects.cc, so it cannot disagree with the library.
      - name: Check imports, x86
        run: |
          python tools/check_imports.py --min-os 5.01 `
            out/x86/static/winwrap_test.exe `
            out/x86/dll/winwrap_test.exe `
            out/x86/debug/static/winwrap_test.exe `
            out/x86/debug/dll/winwrap_test.exe

      - name: Check imports, x64
        run: |
          python tools/check_imports.py --min-os 5.02 `
            out/x64/static/winwrap_test.exe `
            out/x64/dll/winwrap_test.exe `
            out/x64/debug/static/winwrap_test.exe `
            out/x64/debug/dll/winwrap_test.exe

      # Run each from its own directory, because the shared-flavour binaries
      # need the winwrap.dll that sits beside them. The harness returns the
      # number of failures, so a non-zero exit is a real failure rather than
      # noise, and `exit /b 1` on each keeps one passing flavour from hiding
      # another that did not.
      #
      # The step has a timeout of its own because of the debug builds. A debug
      # CRT reports a failed assertion in a message box by default, and on a
      # runner nobody is there to dismiss it: the test would sit until the
      # job's 60 minutes ran out. Ten is many times what all eight need.
      - name: Run the unit tests
        shell: cmd
        timeout-minutes: 10
        run: |
          for %%A in (x86 x64) do for %%F in (static dll debug\static debug\dll) do (
            echo.
            echo ==== %%A %%F ====================================
            pushd out\%%A\%%F || exit /b 1
            winwrap_test.exe || (popd & echo FAILED: %%A %%F & exit /b 1)
            popd
          )

      # out\ is uploaded directly, and deliberately not zipped first. GitHub
      # zips every artifact on the way out and again names the download after
      # the artifact, so compressing here produced a .zip holding one .zip --
      # two unpacking steps to reach a .lib. The artifact name below is what
      # the downloaded file is called, so the revision still travels with it.
      #
      # Three exclusions, all of them build state that happens to land beside
      # the output rather than under obj\:
      #
      #   obj\    the intermediate objects for eight flavours, which dwarf
      #           everything anyone would want out of this.
      #   *.ilk   link.exe's incremental-link database, written because the
      #           test and DLL links pass /DEBUG. It is only meaningful to a
      #           later incremental link in the same directory.
      #   *.exp   the export file the DLL link emits alongside /IMPLIB. It
      #           exists to break circular link dependencies while building
      #           the DLL; a consumer links winwrap.lib and never sees it.
      #
      # .pdb files are deliberately kept. They are the one by-product a
      # consumer has a real use for, and the Makefile names them explicitly
      # for that reason -- without them a crash in winwrap on someone else's
      # machine is an address and nothing more.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winwrap-${{ steps.rev.outputs.short }}
          path: |
            out/**
            !out/**/obj/**
            !out/**/*.ilk
            !out/**/*.exp
          if-no-files-found: error

  # Roll the fixed "ci-build" prerelease to this commit so it always tracks the
  # latest build under a stable tag, the same arrangement nano-win uses: a
  # consumer or script fetches the newest library from a constant URL
  # (.../releases/download/ci-build/winwrap_x86_static.zip and the other
  # seven) without having to know a commit hash.
  #
  # A separate job rather than more steps on the build, for two reasons. The
  # build keeps contents: read -- only this job needs write, and it runs no
  # compiler. And `needs` plus the default success() gate means a release is
  # only ever rolled from a build whose eight flavours all passed their unit
  # tests, since those run before the upload.
  #
  # Restricted to main. This workflow is dispatch-only, so github.ref is
  # whichever branch someone picked, and a run from a topic branch must not
  # replace the rolling release with an unmerged commit.
  publish:
    name: Publish CI Build
    needs: build
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # For git log and src/winwrap_version.h, both of which go in the notes.
      - name: Checkout
        uses: actions/checkout@v4

      # By pattern rather than by name, so this does not need the build job's
      # short-sha output plumbed through as a job output.
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: winwrap-*
          merge-multiple: true

      # One zip per flavour, with fixed names. Release assets are served as
      # uploaded -- unlike artifacts, GitHub does not re-zip them -- so unlike
      # the artifact step above, zipping here is what makes the download a
      # single file instead of four loose ones per flavour.
      #
      # Release builds keep the names they have always had,
      # winwrap_<arch>_<form>.zip, so nothing that fetches one has to change.
      # Debug builds are winwrap_<arch>_debug_<form>.zip, from
      # out/<arch>/debug/<form>. That directory is a sibling of the release
      # forms and not inside them, so zipping out/<arch>/static whole does not
      # take a debug build with it.
      - name: Package each flavour
        run: |
          mkdir -p dist
          for arch in x86 x64; do
            for form in static dll; do
              for config in release debug; do
                if [ "$config" = debug ]; then
                  dir="out/$arch/debug/$form"
                  zip="winwrap_${arch}_debug_${form}.zip"
                else
                  dir="out/$arch/$form"
                  zip="winwrap_${arch}_${form}.zip"
                fi
                if [ -d "$dir" ]; then
                  (cd "$dir" && zip -q -r "$GITHUB_WORKSPACE/dist/$zip" .)
                else
                  echo "ERROR: $dir is missing from the artifact"
                  exit 1
                fi
              done
            done
          done
          ls -la dist

      - name: Upload ci-build Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^#define WINWRAP_\(MAJOR\|MINOR\|BUILD\)_VERSION *//p' \
                    src/winwrap_version.h | paste -sd. -)
          # Header, then the full commit message, so a multi-line message
          # customises the notes the way it does for nano-win.
          {
            echo "Automated build of winwrap $VERSION at commit ${{ github.sha }}"
            echo
            echo "Built with MSVC 2022 against Windows SDK ${{ env.WINDOWS_SDK }}."
            echo
            echo "----"
            git log -1 --format='%B'
          } > release-notes.md
          # Delete the old release and its tag, then recreate at this commit so
          # the tag always points at what the assets were built from.
          gh release delete ci-build --cleanup-tag --yes || true
          gh release create ci-build dist/*.zip \
            --target "${{ github.sha }}" \
            --title "CI Build (latest)" \
            --prerelease \
            --notes-file release-notes.md
